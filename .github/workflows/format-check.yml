# ワークフローの名前
name: Code Format Check

# mainブランチに対するプルリクエストが作られたら実行
on:
  pull_request:
    branches:
      - main

# 実行するジョブ
jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
    - name: コードを取得
      uses: actions/checkout@v4

    - name: .NETをセットアップ
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 1. 念のためソリューションファイルがなくても動くように「フォルダ全体」を指定
    # 2. 空白と改行（whitespace）に絞って確実に実行
    - name: フォーマットチェックを実行
      run: |-
        dotnet format whitespace . \
          --verify-no-changes \
          --severity info

    # 失敗したときだけ、GitHubの画面に簡易的な通知を出す
    - name: チェック失敗時の通知
      if: failure()
      run: echo "コードの書き方がルールと違います。.editorconfigの設定を確認してください。" >> $GITHUB_STEP_SUMMARY
